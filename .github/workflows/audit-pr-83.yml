name: Audit recovered PR 83

on:
  pull_request:
    paths:
      - "app/api/anchors/**"
      - "app/api/corridors/**"
      - "app/api/rates/**"
      - "app/api/reputation/**"
      - "lib/api/rateLimiter.ts"
      - "tests/unit/api/rateLimiter.test.ts"
      - "tests/unit/reputation/reputationProperties.test.ts"
      - "docs/api-reference.md"
      - "docs/reputation-methodology.md"
      - ".github/workflows/audit-pr-83.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://stellarcore:stellarcore@localhost:5432/stellarcore
        run: npx prisma generate
      - run: npx tsc --noEmit
      - run: node --import tsx --test tests/unit/api/rateLimiter.test.ts tests/unit/reputation/reputationProperties.test.ts
      - run: npm run lint
      - name: Full tests
        env:
          STELLARCORE_ENVIRONMENT: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: npm test
      - name: Build
        env:
          DATABASE_URL: postgresql://stellarcore:stellarcore@localhost:5432/stellarcore
          STELLARCORE_ENVIRONMENT: ci
        run: npm run build
