name: Audit production maintenance mode

on:
  pull_request:
    paths:
      - "lib/maintenance/**"
      - "scripts/maintenance.ts"
      - "lib/scheduled/refresh.ts"
      - "scripts/bootstrap-registry.ts"
      - "scripts/snapshot-rates.ts"
      - "types/scheduled.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "tests/unit/maintenance/**"
      - "tests/unit/scheduled/refreshMaintenance.test.ts"
      - "tests/integration/maintenance/**"
      - ".github/workflows/audit-maintenance-mode.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellarcore_maintenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/stellarcore_maintenance
      STELLARCORE_ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: node --import tsx --test tests/unit/maintenance/maintenance.test.ts tests/unit/scheduled/refreshMaintenance.test.ts
      - name: Verify database race barrier
        env:
          RUN_MAINTENANCE_DATABASE_INTEGRATION: "1"
        run: node --import tsx --test tests/integration/maintenance/databaseGuard.integration.test.ts
      - run: npm run lint
      - name: Full tests
        env:
          STELLARCORE_ENVIRONMENT: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: npm test
      - name: Build
        env:
          STELLARCORE_ENVIRONMENT: ci
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/stellarcore_maintenance
        run: npm run build
