# Production release with SBOM and verifiable build provenance (#142).
#
# Every production build emits:
#   1. stellarcore-sbom.json        — CycloneDX 1.5 SBOM of the locked
#                                     production dependency graph.
#   2. stellarcore-provenance.json  — provenance record binding the SBOM to
#                                     the exact commit, workflow run, Node/npm
#                                     versions, and the package-lock.json
#                                     SHA-256 digest used for installation.
#   3. An OCI-style attestation produced by GitHub's artifact-attestation API
#     (actions/attest-build-provenance) over the manifest files, signed with
#     the workflow's OIDC identity and verifiable offline with `gh attestation`.
#
# Integrity rules enforced here:
# - Provenance is generated by CI from the checked-out revision; it is never
#   handwritten or accepted from a build caller.
# - Dependency identity derives from the lockfile actually used for
#   `npm ci` (the digest covers that exact file).
# - Verification (verify:release) fails the release on any digest mismatch,
#   missing field, or lockfile drift; failures are never silently ignored.
# - No environment secrets, connection strings, or database contents enter
#   the artifacts: they contain only paths, digests, versions, and identity
#   strings.

name: Deploy production release

on:
  workflow_dispatch:

permissions:
  contents: read
  # Required by actions/attest-build-provenance to write the attestation.
  id-token: write
  attestations: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: build, attest, verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch the exact revision so the digest covers the full checkout.
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Install from the locked graph; the lockfile digest in provenance
      # covers exactly this file. Prisma generate runs via postinstall and
      # needs DATABASE_URL to resolve prisma.config.ts, but the release build
      # itself never touches the database.
      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Capture npm version
        run: echo "STELLARCORE_NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"

      - name: Generate release manifest (SBOM + provenance)
        run: npm run release:manifest
        env:
          STELLARCORE_COMMIT_SHA: ${{ github.sha }}
          STELLARCORE_WORKFLOW_REF: ${{ github.workflow_ref }}
          STELLARCORE_INVOCATION_ID: ${{ github.run_id }}
          STELLARCORE_ENVIRONMENT_ID: production

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist-release/stellarcore-sbom.json
            dist-release/stellarcore-provenance.json

      # Verification must pass before anything is published. This detects:
      # - a deliberately mismatched artifact/attestation fixture,
      # - lockfile drift between install and manifest generation,
      # - secret material accidentally present in artifacts.
      - name: Verify release manifest
        run: npm run verify:release
        env:
          STELLARCORE_RELEASE_DIR: dist-release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stellarcore-release-manifest-${{ github.run_id }}
          path: |
            dist-release/stellarcore-sbom.json
            dist-release/stellarcore-provenance.json
          retention-days: 90
          if-no-files-found: error
