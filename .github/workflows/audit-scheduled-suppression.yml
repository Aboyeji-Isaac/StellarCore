name: Audit scheduled source suppression

on:
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "lib/scheduled/suppression.ts"
      - "lib/scheduled/suppressionRepository.ts"
      - "lib/scheduled/refresh.ts"
      - "lib/rates/snapshotRun.ts"
      - "lib/rates/latestRateReadModel.ts"
      - "types/suppression.ts"
      - "types/scheduled.ts"
      - "types/liveRateSource.ts"
      - "scripts/reactivate-scheduled-source.ts"
      - "tests/unit/scheduled/suppression.test.ts"
      - "tests/unit/scheduled/refresh.test.ts"
      - "tests/unit/rates/snapshotRun.test.ts"
      - "tests/unit/rates/latestRateReadModel.test.ts"
      - ".github/workflows/audit-scheduled-suppression.yml"

permissions:
  contents: read

jobs:
  audit:
    name: audit scheduled source suppression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://stellarcore:stellarcore@localhost:5432/stellarcore
        run: npx prisma validate

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://stellarcore:stellarcore@localhost:5432/stellarcore
        run: npx prisma generate

      - name: Run suppression policy tests
        run: >-
          npx tsx --test
          tests/unit/scheduled/suppression.test.ts
          tests/unit/scheduled/refresh.test.ts
          tests/unit/rates/snapshotRun.test.ts
          tests/unit/rates/latestRateReadModel.test.ts
