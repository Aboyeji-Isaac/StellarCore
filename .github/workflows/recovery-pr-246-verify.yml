name: Recovery verification PR 246

on:
  push:
    branches:
      - recovery/pr-246-glorious21

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/stellarcore_ci
      STELLARCORE_ENVIRONMENT: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Rate and SEP-38 tests
        run: npx tsx --test tests/unit/rates/*.test.ts tests/unit/stellar/sep38.test.ts tests/integration/rates/*.test.ts
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
