name: Scheduled pipeline fault injection

on:
  pull_request:
    paths:
      - "lib/rates/**"
      - "lib/reputation/**"
      - "lib/scheduled/**"
      - "types/rates.ts"
      - "types/reputation.ts"
      - "types/liveRateSource.ts"
      - "types/scheduled.ts"
      - "tests/faults/**"
      - "package.json"
      - ".github/workflows/test-fault-injection.yml"

permissions:
  contents: read

jobs:
  faults:
    name: deterministic fault-injection suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://stellarcore:stellarcore@localhost:5432/stellarcore
        run: npx prisma generate

      - name: Run deterministic fault suite
        run: npm run test:faults
