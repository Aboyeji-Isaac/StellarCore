name: Verify PR 84 recovery

on:
  pull_request:
    paths:
      - "app/anchors/[slug]/page.tsx"
      - "docs/rfc-outcome-webhook-schema.md"
      - "docs/verification-second-sep38-usdc-brl.md"
      - "tests/unit/frontend/anchorPage.test.ts"
      - "tests/unit/rates/median.property.test.ts"
      - ".github/workflows/verify-pr84-recovery.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://stellarcore:stellarcore@localhost:5432/stellarcore
        run: npx prisma generate
      - run: npx tsc --noEmit
      - name: Focused contributor tests
        run: node --import tsx --test tests/unit/frontend/anchorPage.test.ts tests/unit/rates/median.property.test.ts
      - run: npm run lint
      - name: Full tests
        env:
          STELLARCORE_ENVIRONMENT: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: npm test
      - name: Build
        env:
          DATABASE_URL: postgresql://stellarcore:stellarcore@localhost:5432/stellarcore
          STELLARCORE_ENVIRONMENT: ci
        run: npm run build
