name: PR Participant Guard

on:
  pull_request_target:
    branches: [development, main]
    types: [opened, reopened, synchronize, ready_for_review, edited, review_requested, review_request_removed]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-participant-guard-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  participant-guard:
    name: PR Participant Guard
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect participation through the GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: node scripts/security/check-pr-participants.mjs
