name: Isolated restore drill

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment identity (must be an approved isolated test target: test, ci, isolated-drill, restore-drill)'
        required: false
        default: 'isolated-drill'
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://localhost:5432/restore_drill_placeholder

      - name: Verify restore drill target identity is isolated
        run: npx tsx scripts/preflight-restore-drill.ts
        env:
          RESTORE_TARGET_ENVIRONMENT: ${{ inputs.target_environment || 'isolated-drill' }}

      - name: Restore, verify, and clean up ephemeral PostgreSQL databases
        if: ${{ success() }}
        run: npx tsx scripts/restore-drill.ts --self-test
        env:
          RESTORE_TARGET_ENVIRONMENT: ${{ inputs.target_environment || 'isolated-drill' }}
