name: Deploy production migrations

# Manually applies committed Prisma migrations to the production database.
#
# This workflow is intentionally manual and kept separate from Vercel builds
# and preview deployments, so an ordinary build or a preview can never mutate
# the production database. It runs only `npx prisma migrate deploy`, which
# applies already-committed migrations; it never runs `prisma migrate dev`,
# `prisma db push`, or any reset command, and it never creates or edits a
# migration.
#
# Source authorization (#146):
#   The first step refuses any dispatch that is not `refs/heads/main`. GitHub
#   branch protection and the `production` environment's deployment branch
#   rules are external settings that the repository YAML cannot fully enforce;
#   the in-file guard is defense-in-depth, not a substitute for those settings.
#
# Dependency install isolation (#146):
#   `npm ci` runs `prisma generate` via `postinstall`, which loads
#   `prisma.config.ts` and requires a `DATABASE_URL` value. The install step
#   therefore receives a clearly non-production placeholder URL. Only the
#   authorized mutation steps receive the real production secret, so lifecycle
#   scripts never execute with the production credential.
#
# One-time setup a repository admin must complete before the first run
# (see docs/DEPLOYMENT.md for the full procedure):
#   1. Create a GitHub Actions environment named `production`.
#   2. Add a `DATABASE_URL` secret to that environment containing the direct
#      PostgreSQL connection string suitable for Prisma Migrate.
#   3. Restrict the `production` environment to the `main` branch.
#   4. Attach required reviewers / protection rules to the `production`
#      environment.

on:
  workflow_dispatch:

# Never run two production migrations at once, and never cancel a migration
# that is already in progress just because another run was triggered.
concurrency:
  group: production-database-migration
  cancel-in-progress: false

# Least privilege: the job only needs to read the repository contents.
permissions:
  contents: read

env:
  # Placeholder only. Satisfies prisma.config.ts during `npm ci` / `prisma
  # generate`. Never a production credential; never used by a mutation step.
  PRISMA_GENERATE_DATABASE_URL: postgresql://prisma-generate-placeholder.invalid:5432/placeholder

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    # GitHub Actions environment: scopes the DATABASE_URL secret to production
    # and allows future required-reviewer / protection rules on this job.
    environment: production
    timeout-minutes: 10
    steps:
      # Ref guard (#146): fail before any checkout or credential is exposed
      # unless the dispatch ref is exactly refs/heads/main. `github.sha` is the
      # commit that was dispatched; later steps must not re-resolve a moving
      # branch head.
      - name: Require protected main ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy production migrations must be dispatched from refs/heads/main (got ${{ github.ref }}). Configure the production environment branch rules to main as well."
          exit 1

      - name: Record reviewed source revision
        run: |
          {
            echo "## Production migrations"
            echo ""
            echo "- Dispatch ref: \`${{ github.ref }}\`"
            echo "- Reviewed source commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Pinned to a verified immutable commit SHA (#146).
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # Credential-free install/generation (#146): the placeholder URL lets
      # `prisma generate` parse prisma.config.ts without any production secret
      # present in this step. This step must never receive secrets.DATABASE_URL.
      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ env.PRISMA_GENERATE_DATABASE_URL }}

      # Authorized mutation: production credential is scoped only to the steps
      # that need it, and is never printed.
      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Environment isolation (#143): immediately after migrations, stamp the
      # database with its explicit production identity.
      - name: Stamp database environment identity
        run: npm run stamp:environment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STELLARCORE_STAMP_ENVIRONMENT: production
