# Manually applies committed Prisma migrations to the production database.
#
# This workflow is intentionally manual and kept separate from Vercel builds
# and preview deployments, so an ordinary build or a preview can never mutate
# the production database. It runs only `npx prisma migrate deploy`, which
# applies already-committed migrations, followed by `npm run db:grants`, which
# re-applies the reviewed least-privilege grant plan (lib/db/grants.ts) so new
# tables get the intended runtime-role privileges. It never runs
# `prisma migrate dev`, `prisma db push`, or any reset command, and it never
# creates or edits a migration.
#
# One-time setup a repository admin must complete before the first run
# (see docs/DEPLOYMENT.md for the full procedure):
#   1. Create a GitHub Actions environment named `production`.
#   2. Add a `MIGRATION_DATABASE_URL` secret to that environment containing
#      the direct PostgreSQL connection string of the migration owner role.
#      This is the only workflow that receives the owner credential; it is
#      never configured for the Vercel runtime.
#   3. Optionally set `DATABASE_READ_ROLE` / `DATABASE_WRITE_ROLE` environment
#      variables (not secrets) when the runtime role names differ from the
#      defaults `stellarcore_reader` / `stellarcore_writer`.
#   4. Optionally attach required reviewers / protection rules to the
#      `production` environment.
#
# The secret is read only from the GitHub `production` environment. Do not
# place it in any repository file.

name: Deploy production migrations

on:
  workflow_dispatch:

# Never run two production migrations at once, and never cancel a migration
# that is already in progress just because another run was triggered.
concurrency:
  group: production-database-migration
  cancel-in-progress: false

# Least privilege: the job only needs to read the repository contents.
permissions:
  contents: read

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    # GitHub Actions environment: scopes the MIGRATION_DATABASE_URL secret to production
    # and allows future required-reviewer / protection rules on this job.
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` runs the existing `postinstall` lifecycle script
      # (`prisma generate`), so no separate Prisma Client generation step is
      # required here. Generation needs no database credential, so no secret is
      # exposed to dependency installation.
      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      # Idempotent: revokes and re-grants the reviewed runtime-role matrix and
      # default privileges. Exits nonzero if a role is missing, over-privileged,
      # or owns application objects. Prints role names and codes only.
      - name: Apply database role grants
        run: npm run db:grants
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_READ_ROLE: ${{ vars.DATABASE_READ_ROLE }}
          DATABASE_WRITE_ROLE: ${{ vars.DATABASE_WRITE_ROLE }}
