# Manually applies committed Prisma migrations to the production database.
#
# This workflow is intentionally manual and kept separate from Vercel builds
# and preview deployments, so an ordinary build or a preview can never mutate
# the production database. Before it migrates anything it runs a read-only
# preflight that proves the resolved credential points at the reviewed
# production database, so a misconfigured `DATABASE_URL` halts the run instead
# of migrating an unintended target. After that preflight passes it runs only
# `npx prisma migrate deploy`, which applies already-committed migrations; it
# never runs `prisma migrate dev`, `prisma db push`, or any reset command, and
# it never creates or edits a migration.
#
# The production target identity is not a secret and is not stored here. It is
# reviewed in the repository at `constants/productionDatabaseIdentity.ts`; a
# planned database replacement is a pull request against that file. See
# docs/production-database-identity.md.
#
# One-time setup a repository admin must complete before the first run
# (see docs/DEPLOYMENT.md for the full procedure):
#   1. Create a GitHub Actions environment named `production`.
#   2. Add a `DATABASE_URL` secret to that environment containing the direct
#      PostgreSQL connection string suitable for Prisma Migrate.
#   3. Review the production target identity in
#      `constants/productionDatabaseIdentity.ts` so the preflight has an
#      approved host, cluster fingerprint, and marker to enforce.
#   4. Optionally attach required reviewers / protection rules to the
#      `production` environment.
#
# The secret is read only from the GitHub `production` environment. Do not
# place it in any repository file.

name: Deploy production migrations

on:
  workflow_dispatch:

# Never run two production migrations at once, and never cancel a migration
# that is already in progress just because another run was triggered.
concurrency:
  group: production-database-migration
  cancel-in-progress: false

# Least privilege: the job only needs to read the repository contents.
permissions:
  contents: read

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    # GitHub Actions environment: scopes the DATABASE_URL secret to production
    # and allows future required-reviewer / protection rules on this job.
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` runs the existing `postinstall` lifecycle script
      # (`prisma generate`), so no separate Prisma Client generation step is
      # required here. That generate step loads `prisma.config.ts`, which
      # resolves `DATABASE_URL`, so the same production secret must be present
      # for this step as well or `npm ci` fails with `PrismaConfigEnvError`.
      # It is scoped to this step only; it is never printed.
      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Read-only target-identity preflight. It opens a `READ ONLY` transaction,
      # compares the server-reported database name and cluster fingerprint
      # against the reviewed registry in `constants/productionDatabaseIdentity.ts`,
      # and checks the non-secret marker row. It writes nothing, prints no
      # secret, and exits nonzero on any mismatch. A direct (non-pooled) URL is
      # required because `inet_server_addr()` is what makes the fingerprint
      # verifiable; a socket or pooling endpoint halts with
      # PRODUCTION_DATABASE_FINGERPRINT_UNVERIFIED.
      - name: Verify production database target identity
        run: npm run preflight:production-database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # `if: success()` is explicit even though it is the default: it is the
      # guard rail that makes the preflight a hard gate on this mutation rather
      # than an advisory step that a later edit could reorder or skip.
      - name: Apply migrations
        if: ${{ success() }}
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
